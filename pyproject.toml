[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "dotenv>=0.9.9",
    "docker>=7.2.0",
    "fastmcp>=4.0.10",
    "google-genai>=2.29.0",
    "openai>=3.26.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "tiktoken>=0.14.0",
]

[tool.uv]
package = true

[project.scripts]
sandbox = "sandbox.__main__:main"

[tool.setuptools.packages.find]
include = ["sandbox*", "agent*", "tools*"]
